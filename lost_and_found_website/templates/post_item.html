{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header">
                <h2 class="card-title mb-0">
                    <i class="fas fa-plus me-2"></i>Post a Lost or Found Item
                </h2>
            </div>
            <div class="card-body">
                <form method="POST" enctype="multipart/form-data" id="postItemForm">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="title" class="form-label">Item Title *</label>
                            <input type="text" class="form-control" id="title" name="title" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="item_type" class="form-label">Type *</label>
                            <select class="form-select" id="item_type" name="item_type" required>
                                <option value="">Select Type</option>
                                <option value="lost">Lost Item</option>
                                <option value="found">Found Item</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="description" class="form-label">Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="4" 
                                  placeholder="Provide detailed description of the item..." required></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="category_id" class="form-label">Category *</label>
                            <select class="form-select" id="category_id" name="category_id" required>
                                <option value="">Select Category</option>
                                {% for category in categories %}
                                <option value="{{ category.category_id }}">{{ category.category_name }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="date_lost_found" class="form-label">Date Lost/Found *</label>
                            <input type="date" class="form-control" id="date_lost_found" name="date_lost_found" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="location" class="form-label">Location *</label>
                        <input type="text" class="form-control" id="location" name="location" 
                               placeholder="Where was it lost/found?" required>
                    </div>

                    <!-- Image Upload Section -->
                    <div class="mb-3">
                        <label for="images" class="form-label">Upload Images</label>
                        <div class="upload-area border border-2 border-dashed rounded p-4 text-center" 
                             onclick="document.getElementById('images').click()">
                            <i class="fas fa-cloud-upload-alt fa-3x text-primary mb-3"></i>
                            <h5>Click to select images or drag and drop</h5>
                            <p class="text-muted mb-0">You can upload up to 5 images. Max size: 5MB each</p>
                        </div>
                        <input type="file" class="form-control d-none" id="images" name="images" 
                               multiple accept="image/*" onchange="previewImages(this)">
                        
                        <!-- Image Preview -->
                        <div id="imagePreview" class="mt-3 d-flex flex-wrap gap-2"></div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label for="contact_info" class="form-label">Contact Information</label>
                            <input type="text" class="form-control" id="contact_info" name="contact_info" 
                                   placeholder="Phone or email (optional)">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label for="reward_amount" class="form-label">Reward Amount</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="reward_amount" name="reward_amount" 
                                       min="0" step="0.01" placeholder="0.00">
                            </div>
                        </div>
                    </div>

                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">
                            <i class="fas fa-plus me-2"></i>Post Item
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
