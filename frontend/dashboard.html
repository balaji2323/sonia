<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <link rel="stylesheet" href="assets/styles.css"/>
  <title>Dashboard - Syddhi Learning</title>
</head>
<body>
  <div class="container">
    <div id="navbar"></div>

    <div style="height:16px"></div>

    <!-- Nice top header card -->
    <div class="card lift reveal">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <h2 style="margin:0 0 6px">My Dashboard</h2>
          <div class="small">Track your enrolled courses, progress, and continue watching.</div>
        </div>
        <a class="btn primary" href="courses.html">Explore Courses</a>
      </div>

      <div style="height:12px"></div>

      <div class="chips">
        <span class="chip">Progress</span>
        <span class="chip">Continue Watching</span>
        <span class="chip">Watch Tracking</span>
      </div>
    </div>

    <div style="height:14px"></div>

    <!-- loadDashboard() will render everything inside -->
    <div id="dash"></div>
  </div>

  <script src="assets/app.js"></script>
  <script>
    document.getElementById("navbar").innerHTML = navBar("dashboard");
    loadDashboard();
  </script>
</body>
</html>
